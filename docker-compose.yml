services:
  app:
    build: .
    ports:
      - "${JIZHANGBEN_BIND:-0.0.0.0}:${JIZHANGBEN_PORT:-8000}:8000"
    environment:
      JIZHANGBEN_DB_PATH: /data/jizhangben.db
      JIZHANGBEN_STATIC_DIR: /app/frontend
      JIZHANGBEN_ALLOW_DEV_FALLBACK: "0"
      JIZHANGBEN_CORS_ORIGINS: "${JIZHANGBEN_CORS_ORIGINS:-http://localhost}"
      JIZHANGBEN_SESSION_SAMESITE: "${JIZHANGBEN_SESSION_SAMESITE:-lax}"
      JIZHANGBEN_SESSION_SECURE: "${JIZHANGBEN_SESSION_SECURE:-auto}"
    volumes:
      - jizhangben-data:/data
    restart: unless-stopped

volumes:
  jizhangben-data:
