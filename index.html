<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记账本</title>
<style>
  /* ===== 颜色变量：改这里就能换整套配色 ===== */
  :root {
    --bg: #EFF1F3;          /* 页面背景：浅灰 */
    --card: #FFFFFF;        /* 卡片背景：白 */
    --ink: #1E2227;         /* 主文字：深墨色 */
    --muted: #6B7280;       /* 次要文字：灰 */
    --line: #E2E5E9;        /* 分隔线、边框 */
    --income: #C03A3A;      /* 收入：红（中国传统：红=涨/收） */
    --expense: #147D5A;     /* 支出：绿（中国传统：绿=跌/支） */
    --dark: #16211D;        /* 深色卡片/主按钮：深青墨 */
    --dark-line: #2A3730;   /* 深色卡片里的分隔线 */
    --mint: #5ED3A8;        /* 深色卡片里的绿色 */
    --coral: #FF7A6E;       /* 深色卡片里的红色 */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    line-height: 1.5;
    padding: 24px 16px 48px;
  }

  .app { max-width: 680px; margin: 0 auto; }

  /* ===== 标题 ===== */
  header { margin-bottom: 20px; }
  header h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  header .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-top: 2px;
  }
  /* 账本切换条（顶部下拉） */
  .book-bar {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    align-items: center;
  }
  .book-bar select { flex: 1; }
  .book-bar .mini-btn { padding: 10px 16px; white-space: nowrap; }

  /* ===== 统计卡片（深色，是本页的视觉中心） ===== */
  .stats {
    background: var(--dark);
    color: #fff;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .stat-balance-label {
    color: #8CA39B;
    font-size: 13px;
  }
  .stat-balance {
    font-size: 44px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
    margin: 4px 0 18px;
    font-family: "SF Mono", "Cascadia Mono", Consolas, "Courier New", monospace;
  }
  .stat-row {
    display: flex;
    gap: 12px;
    border-top: 1px solid var(--dark-line);
    padding-top: 16px;
  }
  .stat { flex: 1; }
  .stat .label { color: #8CA39B; font-size: 13px; }
  .stat .value {
    font-size: 20px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    font-family: "SF Mono", "Cascadia Mono", Consolas, "Courier New", monospace;
  }
  .value.income { color: var(--coral); }
  .value.expense { color: var(--mint); }

  /* ===== 导航切换（记一笔 / 账户 / 明细） ===== */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .tab {
    flex: 1;
    padding: 10px 0;
    text-align: center;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    color: var(--muted);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s, color .15s, border-color .15s;
  }
  .tab:hover { border-color: var(--ink); }
  .tab.active {
    background: var(--dark);
    color: #fff;
    border-color: var(--dark);
  }

  /* ===== 通用卡片 ===== */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 16px;
  }

  /* ===== 表单字段 ===== */
  .field { margin-bottom: 16px; }
  .field-label {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .field-row { display: flex; gap: 12px; }
  .field-row .field { flex: 1; }

  input[type="number"], input[type="text"], input[type="date"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 16px;
    font-family: inherit;
    color: var(--ink);
    background: #FAFBFC;
  }
  input:focus {
    outline: none;
    border-color: var(--ink);
    background: #fff;
  }
  input[type="number"] {
    font-family: "SF Mono", "Cascadia Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }

  /* ===== 可点选的"按钮块"（类型、类别） ===== */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip {
    padding: 8px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;         /* 胶囊形 */
    background: #fff;
    color: var(--ink);
    font-size: 14px;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
    font-family: inherit;
  }
  .chip:hover { border-color: var(--ink); }
  .chip.selected {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }
  /* 收入和支出选中时，用红/绿强化含义 */
  .chip.selected.chip-income { background: var(--income); border-color: var(--income); }
  .chip.selected.chip-expense { background: var(--expense); border-color: var(--expense); }
  /* 展开/收起、自定义新增 */
  .chip-toggle { color: var(--muted); border-style: dashed; }
  .chip-add { color: var(--expense); border-style: dashed; font-weight: 600; }
  .custom-add { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .custom-add input { flex: 1; }
  .custom-add .mini-btn { padding: 8px 14px; white-space: nowrap; }
  .custom-side { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .custom-side-label { font-size: 13px; color: var(--muted); }
  .custom-side-chip { padding: 5px 12px; font-size: 13px; }
  .chip-del { margin-left: 6px; font-weight: 700; color: #B9BEC6; line-height: 1; }
  .chip-del:hover { color: var(--income); }
  .chip.selected .chip-del { color: rgba(255,255,255,0.85); }

  /* ===== 按钮 ===== */
  .btn-primary {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: var(--dark);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-primary:hover { opacity: 0.92; }
  .btn-ghost {
    display: none;               /* 默认隐藏，编辑时才出现 */
    margin-top: 8px;
    width: 100%;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  .form-msg {
    margin-top: 10px;
    font-size: 14px;
    color: var(--expense);
    min-height: 20px;
  }

  /* ===== 明细列表 ===== */
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row-main { flex: 1; min-width: 0; }
  .row-top { display: flex; align-items: center; gap: 8px; }
  .badge {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 12px;
    background: #F0F1F3;
    color: var(--muted);
  }
  .badge.income { background: #FBE9E8; color: var(--income); }
  .badge.expense { background: #E4F2EC; color: var(--expense); }
  .row-cat { font-size: 14px; font-weight: 600; }
  .row-note { font-size: 13px; color: var(--muted); }
  .row-date { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .date-head {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    padding: 16px 0 4px;
  }
  .date-head:first-child { padding-top: 0; }

  /* ===== 明细阶段汇总 ===== */
  .period-summary {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .period-stat {
    flex: 1;
    background: #F7F8F9;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    text-align: center;
  }
  .period-stat .label { font-size: 12px; color: var(--muted); }
  .period-stat .value {
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    font-family: "SF Mono", "Cascadia Mono", Consolas, monospace;
    margin-top: 2px;
  }
  .period-stat .value.income { color: var(--income); }
  .period-stat .value.expense { color: var(--expense); }
  .period-stat .value.debt { color: var(--ink); }

  /* ===== 统计图 ===== */
  .chart-legend { display: flex; flex-direction: column; gap: 6px; }
  .chart-legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .chart-legend-item .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .row-amount {
    font-size: 16px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    font-family: "SF Mono", "Cascadia Mono", Consolas, monospace;
    white-space: nowrap;
  }
  .row-amount.income { color: var(--income); }
  .row-amount.expense { color: var(--expense); }
  .row-amount.neutral { color: var(--ink); }
  .row-actions { display: flex; gap: 6px; }
  .mini-btn {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 13px;
    cursor: pointer;
    color: var(--muted);
    font-family: inherit;
  }
  .mini-btn:hover { border-color: var(--ink); color: var(--ink); }
  .mini-btn.danger:hover { border-color: var(--income); color: var(--income); }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 24px 0;
    font-size: 14px;
  }
  .empty.small { padding: 12px 0; font-size: 13px; }

  /* ===== 下拉框（账户） ===== */
  select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 16px;
    font-family: inherit;
    color: var(--ink);
    background: #FAFBFC;
  }
  select:focus { outline: none; border-color: var(--ink); background: #fff; }

  /* ===== 净资产行 ===== */
  .stat-networth {
    border-top: 1px solid var(--dark-line);
    margin-top: 16px;
    padding-top: 14px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .stat-networth .label { color: #8CA39B; font-size: 13px; }
  .stat-networth .value {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-family: "SF Mono", "Cascadia Mono", Consolas, monospace;
  }

  /* ===== 账户列表 ===== */
  .acc-group-label { font-size: 12px; color: var(--muted); margin: 6px 0 2px; }
  .acc-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .acc-row:last-child { border-bottom: none; }
  .acc-main { flex: 1; min-width: 0; }
  .acc-name { font-size: 15px; font-weight: 600; }
  .acc-kind {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 12px;
    background: #F0F1F3;
    color: var(--muted);
  }
  .acc-kind.liab { background: #FBE9E8; color: var(--income); }
  .acc-init { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .acc-balance {
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    font-family: "SF Mono", "Cascadia Mono", Consolas, monospace;
    white-space: nowrap;
  }
  .acc-balance.neg { color: var(--income); }
  .acc-msg { margin-top: 10px; font-size: 14px; color: var(--expense); min-height: 20px; }
  .acc-msg.warn { color: var(--income); }
  .backup-desc { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.6; }
  .backup-actions { display: flex; gap: 8px; margin-top: 10px; }
  .backup-actions .btn-ghost { display: block; flex: 1; margin-top: 0; }

  /* ===== 总览（跨账本） ===== */
  .ov-income { color: var(--income); }
  .ov-expense { color: var(--expense); }
  .overview-total {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .overview-total .label { color: var(--muted); font-size: 13px; }
  .overview-total .value {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-family: "SF Mono", "Cascadia Mono", Consolas, monospace;
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>记账本</h1>
    <div class="subtitle">记下每一笔，清楚每一分</div>
    <div class="book-bar">
      <select id="bookSel" title="切换账本"></select>
      <button id="bookManageBtn" class="mini-btn" type="button">管理</button>
    </div>
  </header>

  <!-- 统计卡片：本月结余 / 收入 / 支出 -->
  <section class="stats">
    <div class="stat-balance-label">本月结余</div>
    <div class="stat-balance" id="balance">¥0.00</div>
    <div class="stat-row">
      <div class="stat">
        <div class="label">本月收入</div>
        <div class="value income" id="incomeTotal">+¥0.00</div>
      </div>
      <div class="stat">
        <div class="label">本月支出</div>
        <div class="value expense" id="expenseTotal">−¥0.00</div>
      </div>
    </div>
    <div class="stat-networth">
      <span class="label">净资产（资金 − 负债）</span>
      <span class="value" id="netWorth">¥0.00</span>
    </div>
  </section>

  <!-- 导航切换 -->
  <nav class="tabs">
    <button class="tab active" data-tab="record">记一笔</button>
    <button class="tab" data-tab="account">账户</button>
    <button class="tab" data-tab="detail">明细</button>
    <button class="tab" data-tab="overview">总览</button>
  </nav>

  <!-- 账本管理 -->
  <section class="card" id="panelBook" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h2 style="margin:0;">账本管理</h2>
      <button id="bookBackBtn" class="mini-btn" type="button">← 返回</button>
    </div>
    <div id="bookList"></div>

    <div style="margin-top:16px; border-top:1px solid var(--line); padding-top:16px;">
      <div class="field-label">新增 / 修改账本</div>
      <div class="field-row" style="margin-top:8px;">
        <div class="field">
          <input id="bookName" type="text" placeholder="账本名称，如 孩子的账">
        </div>
        <div class="field">
          <input id="bookCategory" type="text" placeholder="分类标签，如 家庭">
        </div>
      </div>
      <button id="bookSaveBtn" class="btn-primary" type="button">添加账本</button>
      <button id="bookCancelBtn" class="btn-ghost" type="button">取消修改</button>
      <div id="bookMsg" class="acc-msg"></div>
    </div>

    <div style="margin-top:16px; border-top:1px solid var(--line); padding-top:16px;">
      <div class="field-label">数据备份</div>
      <div class="backup-desc">导出会把所有账本和账目存成一个文件；换电脑或清缓存后，用「导入备份」选回那个文件即可恢复。</div>
      <div class="backup-actions">
        <button id="exportBtn" class="btn-ghost" type="button">导出备份</button>
        <button id="importBtn" class="btn-ghost" type="button">导入备份</button>
        <input id="importFile" type="file" accept=".json,application/json" style="display:none;">
      </div>
      <div id="backupMsg" class="acc-msg"></div>
    </div>
  </section>

  <!-- 记一笔 -->
  <section class="card" id="panelRecord">
    <h2>记一笔</h2>

    <div class="field">
      <div class="field-label">类型</div>
      <div class="chips" id="typeChips"></div>
      <div id="typeCustomBox"></div>
    </div>

    <div class="field">
      <div class="field-label">金额</div>
      <input id="amount" type="number" min="0" step="0.01" placeholder="0.00">
    </div>

    <div class="field">
      <div class="field-label">类别</div>
      <div class="chips" id="categoryChips"></div>
      <div id="categoryCustomBox"></div>
    </div>

    <div class="field">
      <div class="field-label">账户</div>
      <select id="accountSel"><option value="">请选择账户</option></select>
    </div>

    <div class="field" id="depositDirField" style="display:none;">
      <div class="field-label">押金方向</div>
      <div class="chips" id="depositDirChips"></div>
    </div>

    <div class="field" id="depositTargetField" style="display:none;">
      <div class="field-label">对象（谁对谁押）</div>
      <input id="depositTarget" type="text" placeholder="如：房东、中介、张三">
    </div>

    <div class="field" id="toAccountField" style="display:none;">
      <div class="field-label">转入账户（转账）</div>
      <select id="toAccountSel"><option value="">请选择转入账户</option></select>
    </div>

    <div class="field-row">
      <div class="field">
        <div class="field-label">备注</div>
        <input id="note" type="text" placeholder="选填">
      </div>
      <div class="field">
        <div class="field-label">日期</div>
        <input id="date" type="date">
      </div>
    </div>

    <button id="saveBtn" class="btn-primary">保存这笔账</button>
    <button id="cancelBtn" class="btn-ghost">取消修改</button>
    <div id="formMsg" class="form-msg"></div>
  </section>

  <!-- 账户 -->
  <section class="card" id="panelAccount" style="display:none;">
    <h2>账户</h2>
    <div id="accountList"></div>

    <div style="margin-top:16px; border-top:1px solid var(--line); padding-top:16px;">
      <div class="field-label">新增账户</div>
      <div class="field-row" style="margin-top:8px;">
        <div class="field">
          <input id="accName" type="text" placeholder="账户名，如 招行卡">
        </div>
        <div class="field">
          <select id="accKind">
            <option value="资金">资金</option>
            <option value="负债">负债</option>
          </select>
        </div>
      </div>
      <div class="field" style="margin-bottom:12px;">
        <input id="accInitial" type="number" min="0" step="0.01" placeholder="本金（初始余额）">
      </div>
      <button id="accSaveBtn" class="btn-primary">添加账户</button>
      <button id="accCancelBtn" class="btn-ghost">取消修改</button>
      <div id="accMsg" class="acc-msg"></div>
    </div>
  </section>

  <!-- 明细 -->
  <section class="card" id="panelDetail" style="display:none;">
    <h2>明细</h2>
    <div class="field-row" style="margin-bottom:12px;">
      <div class="field" style="margin-bottom:0;">
        <div class="field-label">从</div>
        <input id="fromDate" type="date">
      </div>
      <div class="field" style="margin-bottom:0;">
        <div class="field-label">到</div>
        <input id="toDate" type="date">
      </div>
    </div>
    <div class="field-row" style="margin-bottom:12px;">
      <div class="field" style="margin-bottom:0;">
        <div class="field-label">账户</div>
        <select id="filterAccountSel"><option value="">全部账户</option></select>
      </div>
      <div class="field" style="margin-bottom:0;">
        <div class="field-label">类别</div>
        <select id="filterCategorySel"><option value="">全部类别</option></select>
      </div>
    </div>
    <div class="field" style="margin-bottom:12px;">
      <input id="searchInput" type="text" placeholder="搜索备注 / 类别 / 类型">
    </div>
    <div id="periodSummary" class="period-summary"></div>
    <button id="detailToggle" class="chip chip-toggle" style="margin-bottom:8px;">▾ 展开明细</button>
    <div id="listWrap">
      <div id="list"></div>
      <div class="empty" id="empty">还没有账目，先记一笔吧</div>
    </div>

    <div style="margin-top:16px; border-top:1px solid var(--line); padding-top:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:12px; flex-wrap:wrap;">
        <span class="field-label" style="margin:0;">统计图（按类别）</span>
        <div style="display:flex; gap:16px; flex-wrap:wrap;">
          <div class="chips" id="chartKindChips"></div>
          <div class="chips" id="chartTypeChips"></div>
        </div>
      </div>
      <div id="chartBox"></div>
    </div>
  </section>

  <!-- 总览（跨账本） -->
  <section class="card" id="panelOverview" style="display:none;">
    <h2>总览（所有账本）</h2>
    <div id="overviewList"></div>
    <div id="overviewTotal" class="overview-total"></div>
  </section>

</div>

<script>
  // ============ 数据 ============
  const STORAGE_KEY = "jizhangben_records";   // localStorage 的钥匙（键名）
  const ACCOUNTS_KEY = "jizhangben_accounts"; // 账户的钥匙（键名）
  const TYPES = ["支出", "收入", "转账", "余额", "借贷", "代付", "报销", "退款", "押金"];
  const CATEGORIES = ["餐饮", "交通", "购物", "娱乐", "居住", "医疗", "教育", "其他"];
  const CUSTOM_TYPES_KEY = "jizhangben_custom_types";            // 自定义类型的钥匙
  const CUSTOM_CATEGORIES_KEY = "jizhangben_custom_categories";  // 自定义类别的钥匙
  const BOOKS_KEY = "jizhangben_books";              // 所有账本的清单（每个账本：{id, name, category}）
  const CURRENT_BOOK_KEY = "jizhangben_current_book"; // 当前打开的是哪个账本
  // 每个账本的账目 / 账户单独存一把钥匙（带账本 id），这样各账本互不干扰
  function recordsKey(id) { return "jizhangben_records_" + id; }
  function accountsKey(id) { return "jizhangben_accounts_" + id; }
  // 这些类型会影响账户余额（需要选账户）
  const FLOW_TYPES = ["支出", "收入", "转账", "代付", "报销", "退款", "押金"];
  // 押金的 4 个方向：
  // side = 归到收入侧还是支出侧；sign = 对该侧的增减；flow = 钱进来还是出去
  const DEPOSIT_DIRS = [
    { key: "收",    label: "主动收",      side: "income",  sign: 1,  flow: "in"  },  // 收押金：收入 +
    { key: "退",    label: "我退给别人",  side: "income",  sign: -1, flow: "out" },  // 退押金：收入 −
    { key: "付",    label: "主动付给别人", side: "expense", sign: 1,  flow: "out" },  // 付押金：支出 +
    { key: "退回", label: "别人退回",    side: "expense", sign: -1, flow: "in"  }   // 退回：支出 −（退款）
  ];
  // 统计图配色（按分类轮流取）
  const CHART_COLORS = ["#C03A3A", "#147D5A", "#3A6EA5", "#E0A63A", "#8A5CC0", "#2FA3A3", "#D15A8A", "#6B7280"];
  // 综合图配色：收入用红色系，支出用绿色系
  const INCOME_COLORS = ["#C03A3A", "#D96C5A", "#E08A6E", "#E8A88A", "#A83333", "#8A2A2A"];
  const EXPENSE_COLORS = ["#147D5A", "#3FA37E", "#6BC4A3", "#2E8B6E", "#1E6B4E", "#0E4D38"];

  let records = [];            // 所有账目（数组，每项是一个对象）
  let selectedType = null;     // 当前选中的"类型"
  let selectedCategory = null; // 当前选中的"类别"
  let selectedDepositDir = null; // 押金方向：付 / 收
  let customTypes = [];         // 用户自己加的类型（{name, side}）
  let customCategories = [];    // 用户自己加的类别
  let customTypeSideDraft = "neutral"; // 新增自定义类型时选的"怎么算"
  let typesExpanded = false;    // 类型是否展开显示全部
  let categoriesExpanded = false; // 类别是否展开显示全部
  const COLLAPSE_COUNT = 5;     // 折叠时默认显示几个
  let detailExpanded = false;   // 明细列表是否展开
  let activeTab = "record";     // 当前显示的大类：record=记一笔 / account=账户 / detail=明细
  let editingId = null;        // 正在编辑的那笔账的 id；null 表示"新增"
  let fromDate = "";           // 明细筛选：起始日期（空 = 不限）
  let toDate = "";             // 明细筛选：结束日期（空 = 不限）
  let filterAccount = "";      // 明细筛选：账户（空 = 全部）
  let filterCategory = "";     // 明细筛选：类别（空 = 全部）
  let searchKey = "";          // 明细搜索关键字（按备注/类别/类型）
  let chartType = "bar";       // 统计图类型：bar=柱形 / pie=扇形
  let chartKind = "expense";   // 统计图口径：expense=支出 / income=收入 / combined=综合

  // 从 localStorage 读取（读当前账本的账目）
  function load() {
    try {
      const raw = localStorage.getItem(recordsKey(currentBookId));
      records = raw ? JSON.parse(raw) : [];
    } catch (e) {
      records = [];
    }
  }
  // 写回 localStorage（写进当前账本自己的钥匙）
  function save() {
    localStorage.setItem(recordsKey(currentBookId), JSON.stringify(records));
  }

  // ============ 账本数据（多账本） ============
  function loadBooks() {
    try {
      books = JSON.parse(localStorage.getItem(BOOKS_KEY)) || [];
    } catch (e) { books = []; }
    if (!Array.isArray(books)) books = [];

    // 第一次升级：老数据存在旧钥匙里，搬进一个默认账本
    if (books.length === 0) {
      const defaultBook = { id: Date.now(), name: "我的账本", category: "个人" };
      books = [defaultBook];
      const oldRecords = localStorage.getItem(STORAGE_KEY);
      const oldAccounts = localStorage.getItem(ACCOUNTS_KEY);
      if (oldRecords != null) localStorage.setItem(recordsKey(defaultBook.id), oldRecords);
      if (oldAccounts != null) localStorage.setItem(accountsKey(defaultBook.id), oldAccounts);
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(ACCOUNTS_KEY);
      saveBooks();
    }

    // 上次打开的是哪个账本（没有或已被删，就用第一个）
    let cur = null;
    try { cur = JSON.parse(localStorage.getItem(CURRENT_BOOK_KEY)); } catch (e) { cur = null; }
    currentBookId = books.some(b => b.id === cur) ? cur : books[0].id;
  }
  function saveBooks() {
    localStorage.setItem(BOOKS_KEY, JSON.stringify(books));
  }

  // 自定义类型 / 类别：读写（存在 localStorage，下次打开还在）
  function loadCustomTypes() {
    try {
      const raw = JSON.parse(localStorage.getItem(CUSTOM_TYPES_KEY)) || [];
      // 兼容旧数据：以前存的是纯字符串，现在统一成 {name, side}
      customTypes = raw.map(t => (typeof t === "string" ? { name: t, side: "neutral" } : t));
    } catch (e) { customTypes = []; }
  }
  function saveCustomTypes() {
    localStorage.setItem(CUSTOM_TYPES_KEY, JSON.stringify(customTypes));
  }
  function loadCustomCategories() {
    try { customCategories = JSON.parse(localStorage.getItem(CUSTOM_CATEGORIES_KEY)) || []; }
    catch (e) { customCategories = []; }
  }
  function saveCustomCategories() {
    localStorage.setItem(CUSTOM_CATEGORIES_KEY, JSON.stringify(customCategories));
  }
  // 实际可选的类型 / 类别 = 内置 + 自定义
  function allTypes() { return TYPES.concat(customTypes.map(t => (typeof t === "string" ? t : t.name))); }
  function allCategories() { return CATEGORIES.concat(customCategories); }
  // 查一个自定义类型的信息（兼容旧的纯字符串）
  function customTypeInfo(name) {
    const t = customTypes.find(x => (typeof x === "string" ? x : x.name) === name);
    if (!t) return null;
    return (typeof t === "string") ? { name: t, side: "neutral" } : t;
  }
  // 一个类型名属于收入侧 / 支出侧 / 中性
  function typeSide(name) {
    if (name === "收入") return "income";
    if (name === "支出") return "expense";
    const ct = customTypeInfo(name);
    return ct ? ct.side : "neutral";
  }
  // 这个类型要不要选账户（影响余额的都要）
  function needsAccount(type) {
    if (FLOW_TYPES.includes(type)) return true;
    const ct = customTypeInfo(type);
    return !!(ct && (ct.side === "income" || ct.side === "expense"));
  }

  // ============ 账户数据 ============
  const DEFAULT_ACCOUNTS = [
    { id: 1, name: "现金", kind: "资金", initial: 0 },
    { id: 2, name: "银行卡", kind: "资金", initial: 0 },
    { id: 3, name: "支付宝", kind: "资金", initial: 0 },
    { id: 4, name: "微信", kind: "资金", initial: 0 },
    { id: 5, name: "信用卡", kind: "负债", initial: 0 },
    { id: 6, name: "花呗", kind: "负债", initial: 0 },
    { id: 7, name: "京东白条", kind: "负债", initial: 0 }
  ];
  let accounts = [];           // 所有账户
  let editingAccountId = null; // 正在编辑的账户 id

  let books = [];              // 所有账本 [{id, name, category}]
  let currentBookId = null;    // 当前打开哪个账本
  let editingBookId = null;    // 正在编辑的账本 id

  function loadAccounts() {
    try {
      const raw = localStorage.getItem(accountsKey(currentBookId));
      accounts = raw ? JSON.parse(raw) : null;
    } catch (e) { accounts = null; }
    if (!accounts || accounts.length === 0) {
      accounts = JSON.parse(JSON.stringify(DEFAULT_ACCOUNTS)); // 深拷贝一份
    }
  }
  function saveAccounts() {
    localStorage.setItem(accountsKey(currentBookId), JSON.stringify(accounts));
  }

  // ============ 工具函数 ============
  // 今天的日期，格式 YYYY-MM-DD（比如 2026-08-20）
  function todayStr() {
    const d = new Date();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }
  // 判断某笔账是不是"本月"的
  function isThisMonth(dateStr) {
    const now = new Date();
    const d = new Date(dateStr);
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  }
  // 把 2026-08-20 显示成 2026年8月20日
  function formatDate(dateStr) {
    const [y, m, d] = dateStr.split("-");
    return y + "年" + Number(m) + "月" + Number(d) + "日";
  }
  // 转义特殊字符，防止备注里的 < > 等破坏页面（好习惯）
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
  }
  // 是否属于"收入侧"（收入 + 押金里归收入的方向 + 自定义算收入的类型）
  function isIncome(r) {
    if (r.type === "收入") return true;
    if (r.type === "押金") {
      const d = DEPOSIT_DIRS.find(x => x.key === r.depositDir);
      return d && d.side === "income";
    }
    const ct = customTypeInfo(r.type);
    return !!(ct && ct.side === "income");
  }
  // 是否属于"支出侧"（支出 + 押金里归支出的方向 + 自定义算支出的类型）
  function isExpense(r) {
    if (r.type === "支出") return true;
    if (r.type === "押金") {
      const d = DEPOSIT_DIRS.find(x => x.key === r.depositDir);
      return d && d.side === "expense";
    }
    const ct = customTypeInfo(r.type);
    return !!(ct && ct.side === "expense");
  }
  // 押金方向 → 完整信息
  function depositInfo(dir) {
    return DEPOSIT_DIRS.find(x => x.key === dir) || null;
  }
  // 押金方向 → 显示文字
  function depositLabel(dir) {
    const d = depositInfo(dir);
    return d ? d.label : (dir || "");
  }
  // 这笔账对"收入"的贡献：正=增加收入，负=减少收入
  function incomeEffect(r) {
    if (r.type === "收入") return Number(r.amount) || 0;
    if (r.type === "押金") {
      const d = depositInfo(r.depositDir);
      if (d && d.side === "income") return d.sign * (Number(r.amount) || 0);
      return 0;
    }
    const ct = customTypeInfo(r.type);
    if (ct && ct.side === "income") return Number(r.amount) || 0;
    return 0;
  }
  // 这笔账对"支出"的贡献：正=增加支出，负=减少支出（退款）
  function expenseEffect(r) {
    if (r.type === "支出") return Number(r.amount) || 0;
    if (r.type === "押金") {
      const d = depositInfo(r.depositDir);
      if (d && d.side === "expense") return d.sign * (Number(r.amount) || 0);
      return 0;
    }
    const ct = customTypeInfo(r.type);
    if (ct && ct.side === "expense") return Number(r.amount) || 0;
    return 0;
  }
  // 金额显示：收入侧红、支出侧绿；钱进来 +、钱出去 −
  function amountText(r) {
    const n = Number(r.amount).toFixed(2);
    if (r.type === "收入") return { text: "+¥" + n, cls: "income" };
    if (r.type === "押金") {
      const d = depositInfo(r.depositDir);
      const cls = (d && d.side === "income") ? "income" : "expense";
      const plus = (d && d.flow === "in");
      return { text: (plus ? "+¥" : "−¥") + n, cls: cls };
    }
    if (r.type === "支出") return { text: "−¥" + n, cls: "expense" };
    const ct = customTypeInfo(r.type);
    if (ct) {
      if (ct.side === "income") return { text: "+¥" + n, cls: "income" };
      if (ct.side === "expense") return { text: "−¥" + n, cls: "expense" };
    }
    return { text: "¥" + n, cls: "neutral" };
  }

  // 这笔账的资金方向：in=进账户 / out=出账户 / transfer=转账 / none=不影响
  function flowDir(r) {
    const type = r.type;
    if (type === "押金") {
      const d = depositInfo(r.depositDir);
      return (d && d.flow === "in") ? "in" : "out";
    }
    if (type === "收入" || type === "报销" || type === "退款") return "in";
    if (type === "支出" || type === "代付") return "out";
    if (type === "转账") return "transfer";
    const ct = customTypeInfo(type);
    if (ct) {
      if (ct.side === "income") return "in";
      if (ct.side === "expense") return "out";
    }
    return "none";
  }

  // 账户 id → 名字
  function accountName(id) {
    const a = accounts.find(x => x.id === id);
    return a ? a.name : "未指定";
  }

  // 计算每个账户的当前余额（本金 + 之后的收支）
  function computeBalancesFor(accs, recs) {
    const bal = {};
    accs.forEach(a => { bal[a.id] = Number(a.initial) || 0; });
    recs.forEach(r => {
      const dir = flowDir(r);
      if (dir === "none") return;
      const amt = Number(r.amount) || 0;
      const a = accs.find(x => x.id === r.account);
      if (!a) return;
      if (dir === "in") {
        bal[a.id] += (a.kind === "负债") ? -amt : amt;
      } else if (dir === "out") {
        bal[a.id] += (a.kind === "负债") ? amt : -amt;
      } else { // transfer：钱从 a 出、进 b
        const b = accs.find(x => x.id === r.toAccount);
        if (b) {
          bal[a.id] += (a.kind === "负债") ? amt : -amt;
          bal[b.id] += (b.kind === "负债") ? -amt : amt;
        }
      }
    });
    return bal;
  }
  // 当前账本的余额
  function computeBalances() {
    return computeBalancesFor(accounts, records);
  }

  // 给下拉框填账户（按资金/负债分组）
  function fillAccountSelect(sel, placeholder) {
    const cur = sel.value;
    sel.innerHTML = '<option value="">' + placeholder + '</option>';
    ["资金", "负债"].forEach(kind => {
      const group = accounts.filter(a => a.kind === kind);
      if (group.length === 0) return;
      const og = document.createElement("optgroup");
      og.label = (kind === "资金") ? "资金账户" : "负债账户";
      group.forEach(a => {
        const op = document.createElement("option");
        op.value = a.id;
        op.textContent = a.name;
        og.appendChild(op);
      });
      sel.appendChild(og);
    });
    if (cur && Array.from(sel.options).some(o => o.value === cur)) sel.value = cur;
  }

  function renderAccountSelects() {
    fillAccountSelect(document.getElementById("accountSel"), "请选择账户");
    fillAccountSelect(document.getElementById("toAccountSel"), "请选择转入账户");
    fillAccountFilter();
  }

  // 明细筛选用的账户下拉（带"全部账户"）
  function fillAccountFilter() {
    const sel = document.getElementById("filterAccountSel");
    const cur = sel.value;
    sel.innerHTML = '<option value="">全部账户</option>';
    ["资金", "负债"].forEach(kind => {
      const group = accounts.filter(a => a.kind === kind);
      if (group.length === 0) return;
      const og = document.createElement("optgroup");
      og.label = (kind === "资金") ? "资金账户" : "负债账户";
      group.forEach(a => {
        const op = document.createElement("option");
        op.value = a.id;
        op.textContent = a.name;
        og.appendChild(op);
      });
      sel.appendChild(og);
    });
    if (cur && Array.from(sel.options).some(o => o.value === cur)) sel.value = cur;
  }

  // 明细筛选用的类别下拉（带"全部类别"）
  function fillCategoryFilter() {
    const sel = document.getElementById("filterCategorySel");
    const cur = sel.value;
    sel.innerHTML = '<option value="">全部类别</option>';
    allCategories().forEach(c => {
      const op = document.createElement("option");
      op.value = c;
      op.textContent = c;
      sel.appendChild(op);
    });
    if (cur && Array.from(sel.options).some(o => o.value === cur)) sel.value = cur;
  }

  // 根据当前类型，显示/隐藏对应字段
  function updateFormFields() {
    document.getElementById("toAccountField").style.display =
      (selectedType === "转账") ? "block" : "none";
    const isDep = (selectedType === "押金");
    document.getElementById("depositDirField").style.display = isDep ? "block" : "none";
    document.getElementById("depositTargetField").style.display = isDep ? "block" : "none";
    if (isDep) renderDepositDirChips();
  }

  // 押金方向按钮（4 个：主动收 / 别人退回 / 主动付给别人 / 我退给别人）
  function renderDepositDirChips() {
    const box = document.getElementById("depositDirChips");
    box.innerHTML = "";
    DEPOSIT_DIRS.forEach(d => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      if (d.side === "income") b.classList.add("chip-income");
      else b.classList.add("chip-expense");
      if (selectedDepositDir === d.key) b.classList.add("selected");
      b.textContent = d.label;
      b.onclick = () => { selectedDepositDir = d.key; renderDepositDirChips(); };
      box.appendChild(b);
    });
  }

  // ============ 渲染：类型 / 类别按钮 ============
  function renderTypeChips() {
    const box = document.getElementById("typeChips");
    box.innerHTML = "";
    const list = allTypes();
    const collapsed = list.slice(0, COLLAPSE_COUNT);
    let visible = typesExpanded ? list : collapsed;
    // 选中的那项即使被折叠，也要露出来，方便看清当前选的是什么
    if (!typesExpanded && selectedType && list.includes(selectedType) && !visible.includes(selectedType)) {
      visible = visible.concat([selectedType]);
    }
    visible.forEach(t => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      const side = typeSide(t);
      if (side === "income") b.classList.add("chip-income");
      if (side === "expense") b.classList.add("chip-expense");
      if (t === selectedType) b.classList.add("selected");
      b.textContent = t;
      if (isCustomType(t)) {
        const x = document.createElement("span");
        x.className = "chip-del";
        x.textContent = "×";
        x.title = "删除这个自定义类型";
        x.onclick = (e) => { e.stopPropagation(); removeCustom("type", t); };
        b.appendChild(x);
      }
      b.onclick = () => { selectedType = t; renderTypeChips(); updateFormFields(); };
      box.appendChild(b);
    });
    if (list.length > COLLAPSE_COUNT) {
      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "chip chip-toggle";
      toggle.textContent = typesExpanded ? "▴ 收起" : "▾ 展开";
      toggle.onclick = () => { typesExpanded = !typesExpanded; renderTypeChips(); };
      box.appendChild(toggle);
    }
    const add = document.createElement("button");
    add.type = "button";
    add.className = "chip chip-add";
    add.textContent = "＋自定义";
    add.onclick = () => renderCustomBox("type");
    box.appendChild(add);
  }

  function renderCategoryChips() {
    const box = document.getElementById("categoryChips");
    box.innerHTML = "";
    const list = allCategories();
    const collapsed = list.slice(0, COLLAPSE_COUNT);
    let visible = categoriesExpanded ? list : collapsed;
    if (!categoriesExpanded && selectedCategory && list.includes(selectedCategory) && !visible.includes(selectedCategory)) {
      visible = visible.concat([selectedCategory]);
    }
    visible.forEach(c => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      if (c === selectedCategory) b.classList.add("selected");
      b.textContent = c;
      if (isCustomCategory(c)) {
        const x = document.createElement("span");
        x.className = "chip-del";
        x.textContent = "×";
        x.title = "删除这个自定义类别";
        x.onclick = (e) => { e.stopPropagation(); removeCustom("category", c); };
        b.appendChild(x);
      }
      b.onclick = () => { selectedCategory = c; renderCategoryChips(); };
      box.appendChild(b);
    });
    if (list.length > COLLAPSE_COUNT) {
      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "chip chip-toggle";
      toggle.textContent = categoriesExpanded ? "▴ 收起" : "▾ 展开";
      toggle.onclick = () => { categoriesExpanded = !categoriesExpanded; renderCategoryChips(); };
      box.appendChild(toggle);
    }
    const add = document.createElement("button");
    add.type = "button";
    add.className = "chip chip-add";
    add.textContent = "＋自定义";
    add.onclick = () => renderCustomBox("category");
    box.appendChild(add);
  }

  // 点「＋自定义」后，在下方显示一个输入行（类型多一行"怎么算"）
  function renderCustomBox(kind) {
    document.getElementById("typeCustomBox").innerHTML = "";
    document.getElementById("categoryCustomBox").innerHTML = "";
    const isType = (kind === "type");
    const box = document.getElementById(isType ? "typeCustomBox" : "categoryCustomBox");
    const label = isType ? "新类型" : "新类别";
    const example = isType ? "工资" : "宠物";
    let html = `
      <div class="custom-add">
        <input id="customInput" type="text" placeholder="${label}名称，如：${example}">
        <button class="mini-btn" id="customOk">添加</button>
        <button class="mini-btn" id="customCancel">取消</button>
      </div>`;
    if (isType) {
      customTypeSideDraft = "neutral";
      html += `
      <div class="custom-side">
        <span class="custom-side-label">怎么算：</span>
        <button class="chip custom-side-chip" data-side="income">算收入</button>
        <button class="chip custom-side-chip" data-side="expense">算支出</button>
        <button class="chip custom-side-chip selected" data-side="neutral">中性</button>
      </div>`;
    }
    box.innerHTML = html;
    const input = document.getElementById("customInput");
    input.focus();
    document.getElementById("customOk").onclick = () => addCustom(kind);
    document.getElementById("customCancel").onclick = () => { box.innerHTML = ""; };
    input.onkeydown = (e) => { if (e.key === "Enter") addCustom(kind); };
    if (isType) {
      box.querySelectorAll(".custom-side-chip").forEach(chip => {
        chip.onclick = () => {
          customTypeSideDraft = chip.dataset.side;
          box.querySelectorAll(".custom-side-chip").forEach(c => c.classList.remove("selected"));
          chip.classList.add("selected");
        };
      });
    }
  }

  // 新增一个自定义类型 / 类别
  function addCustom(kind) {
    const input = document.getElementById("customInput");
    const name = (input.value || "").trim();
    const isType = (kind === "type");
    if (!name) { alert(isType ? "请先输入新类型名称" : "请先输入新类别名称"); return; }
    const list = isType ? allTypes() : allCategories();
    if (list.includes(name)) { alert("「" + name + "」已经存在了"); return; }
    if (isType) {
      customTypes.push({ name: name, side: customTypeSideDraft });
      saveCustomTypes();
      selectedType = name;
    } else {
      customCategories.push(name);
      saveCustomCategories();
      selectedCategory = name;
    }
    document.getElementById(isType ? "typeCustomBox" : "categoryCustomBox").innerHTML = "";
    renderTypeChips();
    renderCategoryChips();
    if (isType) updateFormFields();
  }

  // 是不是自定义（只有自定义的才能删）
  function isCustomType(name) {
    return customTypes.some(x => (typeof x === "string" ? x : x.name) === name);
  }
  function isCustomCategory(name) {
    return customCategories.includes(name);
  }

  // 删除一个自定义类型 / 类别
  function removeCustom(kind, name) {
    const used = (kind === "type")
      ? records.filter(r => r.type === name).length
      : records.filter(r => r.category === name).length;
    let msg = "删除「" + name + "」吗？";
    if (used > 0) {
      msg += (kind === "type")
        ? "\n已有 " + used + " 笔账用它，删除后这些账还在，但不再算收入/支出（变中性）。"
        : "\n已有 " + used + " 笔账用它，删除后这些账还在，只是以后不能再选它。";
    }
    if (!confirm(msg)) return;
    if (kind === "type") {
      customTypes = customTypes.filter(x => (typeof x === "string" ? x : x.name) !== name);
      saveCustomTypes();
      if (selectedType === name) selectedType = null;
    } else {
      customCategories = customCategories.filter(c => c !== name);
      saveCustomCategories();
      if (selectedCategory === name) selectedCategory = null;
      if (filterCategory === name) {
        filterCategory = "";
        document.getElementById("filterCategorySel").value = "";
      }
    }
    document.getElementById("typeCustomBox").innerHTML = "";
    document.getElementById("categoryCustomBox").innerHTML = "";
    renderTypeChips();
    renderCategoryChips();
    if (kind === "type") updateFormFields();
    if (kind === "category") fillCategoryFilter();
    refreshDetail();
  }

  // ============ 渲染：统计卡片 ============
  function renderStats() {
    const month = records.filter(r => isThisMonth(r.date));
    const income = month.reduce((s, r) => s + incomeEffect(r), 0);
    const expense = month.reduce((s, r) => s + expenseEffect(r), 0);
    const balance = income - expense;

    document.getElementById("incomeTotal").textContent =
      (income < 0 ? "−¥" : "+¥") + Math.abs(income).toFixed(2);
    document.getElementById("expenseTotal").textContent =
      (expense < 0 ? "+¥" : "−¥") + Math.abs(expense).toFixed(2);
    document.getElementById("balance").textContent =
      (balance < 0 ? "−¥" : "¥") + Math.abs(balance).toFixed(2);

    // 净资产 = 所有资金账户余额 − 所有负债账户欠款
    const bal = computeBalances();
    let net = 0;
    accounts.forEach(a => { net += (a.kind === "负债") ? -bal[a.id] : bal[a.id]; });
    document.getElementById("netWorth").textContent =
      (net < 0 ? "−¥" : "¥") + Math.abs(net).toFixed(2);
  }

  // ============ 明细时间段筛选（自定义起止日期） ============
  function filterByPeriod(recs) {
    return recs.filter(r => {
      if (fromDate && r.date < fromDate) return false;
      if (toDate && r.date > toDate) return false;
      if (filterAccount && String(r.account) !== filterAccount) return false;
      if (filterCategory && r.category !== filterCategory) return false;
      return true;
    });
  }
  // 搜索关键字：匹配备注 / 类别 / 类型（不区分大小写）
  function matchesSearch(r) {
    const k = searchKey.trim().toLowerCase();
    if (!k) return true;
    const hay = ((r.note || "") + " " + r.category + " " + r.type).toLowerCase();
    return hay.includes(k);
  }

  // 这个账户是不是负债账户
  function isLiabAccount(id) {
    const a = accounts.find(x => x.id === id);
    return a && a.kind === "负债";
  }

  // 所选阶段的汇总：总收入 / 总支出 / 新增负债
  function renderPeriodSummary() {
    const box = document.getElementById("periodSummary");
    const shown = filterByPeriod(records);
    const income = shown.reduce((s, r) => s + incomeEffect(r), 0);
    const expense = shown.reduce((s, r) => s + expenseEffect(r), 0);
    // 新增负债 = 支出侧的钱进出负债账户（付押金用花呗算新增，退回算减少）
    const debt = shown.reduce((s, r) => {
      const e = expenseEffect(r);
      return (e !== 0 && isLiabAccount(r.account)) ? s + e : s;
    }, 0);
    const incomeText = (income < 0 ? "−¥" : "+¥") + Math.abs(income).toFixed(2);
    const expenseText = (expense < 0 ? "+¥" : "−¥") + Math.abs(expense).toFixed(2);
    const debtText = (debt < 0 ? "−¥" : "¥") + Math.abs(debt).toFixed(2);

    box.innerHTML = `
      <div class="period-stat">
        <div class="label">总收入</div>
        <div class="value income">${incomeText}</div>
      </div>
      <div class="period-stat">
        <div class="label">总支出</div>
        <div class="value expense">${expenseText}</div>
      </div>
      <div class="period-stat">
        <div class="label">新增负债</div>
        <div class="value debt">${debtText}</div>
      </div>
    `;
  }

  // ============ 渲染：明细列表 ============
  function renderList() {
    const list = document.getElementById("list");
    const empty = document.getElementById("empty");
    const toggle = document.getElementById("detailToggle");
    const wrap = document.getElementById("listWrap");
    list.innerHTML = "";

    // 先按时间段筛选，再按搜索关键字筛选
    const shown = filterByPeriod(records);
    const filtered = shown.filter(matchesSearch);

    // 没有任何账目时，只提示，不显示"展开"按钮
    if (records.length === 0) {
      toggle.style.display = "none";
      wrap.style.display = "block";
      empty.style.display = "block";
      empty.textContent = "还没有账目，先记一笔吧";
      return;
    }
    // 有账目：默认收起，点按钮才展开
    toggle.style.display = "inline-block";
    toggle.textContent = detailExpanded
      ? "▴ 收起明细"
      : "▾ 展开明细（共 " + filtered.length + " 笔）";
    wrap.style.display = detailExpanded ? "block" : "none";
    if (!detailExpanded) return;

    if (shown.length === 0) {
      empty.style.display = "block";
      empty.textContent = "这个时间段没有账目";
      return;
    }
    if (filtered.length === 0) {
      empty.style.display = "block";
      empty.textContent = "没有找到匹配的账目";
      return;
    }
    empty.style.display = "none";

    // 按日期从新到旧排（同一天按 id 大的在前 = 后记的在前）
    const sorted = [...filtered].sort((a, b) =>
      b.date.localeCompare(a.date) || b.id - a.id
    );

    // 按日期分组，一组一个日期标题
    const groups = {};
    sorted.forEach(r => { (groups[r.date] = groups[r.date] || []).push(r); });

    Object.keys(groups).forEach(date => {
      const head = document.createElement("div");
      head.className = "date-head";
      head.textContent = formatDate(date);
      list.appendChild(head);

      groups[date].forEach(r => {
        const row = document.createElement("div");
        row.className = "row";

        const amt = amountText(r);
        const isDep = (r.type === "押金");
        const badgeText = isDep ? depositLabel(r.depositDir) : r.type;
        const badgeCls = isIncome(r) ? "income" : isExpense(r) ? "expense" : "";
        let accLabel = accountName(r.account);
        if (r.type === "转账" && r.toAccount) {
          accLabel = accountName(r.account) + " → " + accountName(r.toAccount);
        }
        const accHtml = r.account ? `<div class="row-date">${esc(accLabel)}</div>` : "";
        // 押金显示"对象"，备注跟在后面
        let noteText = r.note || "";
        if (isDep && r.depositTarget) {
          noteText = "对象：" + r.depositTarget + (noteText ? " · " + noteText : "");
        }

        row.innerHTML = `
          <div class="row-main">
            <div class="row-top">
              <span class="badge ${badgeCls}">${esc(badgeText)}</span>
              <span class="row-cat">${esc(r.category)}</span>
            </div>
            <div class="row-note">${esc(noteText)}</div>
            ${accHtml}
          </div>
          <div class="row-amount ${amt.cls}">${amt.text}</div>
          <div class="row-actions">
            <button class="mini-btn" data-id="${r.id}" data-act="edit">改</button>
            <button class="mini-btn danger" data-id="${r.id}" data-act="del">删</button>
          </div>
        `;
        list.appendChild(row);
      });
    });

    // 给"改""删"按钮绑事件
    list.querySelectorAll(".mini-btn").forEach(btn => {
      btn.onclick = () => {
        const id = Number(btn.dataset.id);
        if (btn.dataset.act === "edit") startEdit(id);
        else deleteRec(id);
      };
    });
  }

  // ============ 总览（跨账本） ============
  // 读某个账本的账目 / 账户（不动当前内存里的数据）
  function readBookRecords(id) {
    try {
      const raw = localStorage.getItem(recordsKey(id));
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function readBookAccounts(id) {
    try {
      const raw = localStorage.getItem(accountsKey(id));
      let accs = raw ? JSON.parse(raw) : null;
      if (!accs || accs.length === 0) accs = JSON.parse(JSON.stringify(DEFAULT_ACCOUNTS));
      return accs;
    } catch (e) { return JSON.parse(JSON.stringify(DEFAULT_ACCOUNTS)); }
  }

  function renderOverview() {
    const box = document.getElementById("overviewList");
    const totalBox = document.getElementById("overviewTotal");
    box.innerHTML = "";
    if (books.length === 0) {
      box.innerHTML = '<div class="empty small">还没有账本</div>';

    books.forEach(b => {

      const expense = month.reduce((s, r) => s + expenseEffect(r), 0);

  // ============ 统计图（按明细筛选，收入/支出/综合按类别） ============
  function renderChartKindChips() {
    const box = document.getElementById("chartKindChips");
    box.innerHTML = "";
    ["支出", "收入", "综合"].forEach(k => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      const val = (k === "支出") ? "expense" : (k === "收入") ? "income" : "combined";
      if (chartKind === val) b.classList.add("selected");
      b.textContent = k;
      b.onclick = () => {
        chartKind = val;
        renderChartKindChips();
        renderChart();
      };
      box.appendChild(b);
    });
  }

  function renderChartTypeChips() {
    const box = document.getElementById("chartTypeChips");
    box.innerHTML = "";
    ["柱形", "扇形"].forEach(t => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      if ((t === "柱形") === (chartType === "bar")) b.classList.add("selected");
      b.textContent = t;
      b.onclick = () => {
        chartType = (t === "柱形") ? "bar" : "pie";
        renderChartTypeChips();
        renderChart();
      };
      box.appendChild(b);
    });
  }

  function renderChart() {
    const box = document.getElementById("chartBox");

    // 综合：收入 + 支出两种颜色一起显示
    if (chartKind === "combined") {
      const shown = filterByPeriod(records);
      const incomeMap = {}, expenseMap = {};
      shown.forEach(r => {
        const eff = incomeEffect(r);
        if (eff > 0) incomeMap[r.category] = (incomeMap[r.category] || 0) + eff;
        else if (expenseEffect(r) > 0) expenseMap[r.category] = (expenseMap[r.category] || 0) + expenseEffect(r);
      });
      const cats = Array.from(new Set([...Object.keys(incomeMap), ...Object.keys(expenseMap)]));
      if (cats.length === 0) {
        box.innerHTML = '<div class="empty small">这个筛选条件下没有收入和支出，画不出图</div>';
        return;
      }
      if (chartType === "bar") renderCombinedBarChart(box, cats, incomeMap, expenseMap);
      else renderCombinedPieChart(box, cats, incomeMap, expenseMap);
      return;
    }

    const targetType = (chartKind === "income") ? "收入" : "支出";
    const shown = filterByPeriod(records).filter(r =>
      chartKind === "income" ? (incomeEffect(r) > 0) : (expenseEffect(r) > 0)
    );
    const map = {};
    shown.forEach(r => { map[r.category] = (map[r.category] || 0) + Number(r.amount); });
    const entries = Object.entries(map).sort((a, b) => b[1] - a[1]);
    const total = entries.reduce((s, e) => s + e[1], 0);

    if (entries.length === 0) {
      box.innerHTML = '<div class="empty small">这个筛选条件下没有' + targetType + '，画不出图</div>';
      return;
    }
    if (chartType === "bar") renderBarChart(box, entries);
    else renderPieChart(box, entries, total);
  }

  // ============ 综合图：柱形（每类两根柱子：红=收入，绿=支出） ============
  function renderCombinedBarChart(box, cats, incomeMap, expenseMap) {
    const W = 600, H = 280, padT = 30, padB = 34, padL = 8, padR = 8;
    const chartW = W - padL - padR;
    const chartH = H - padT - padB;
    const max = Math.max(
      ...Object.values(incomeMap),
      ...Object.values(expenseMap),
      0
    );
    const n = cats.length;
    const slot = chartW / n;
    const barW = Math.min(22, slot * 0.28);
    const gap = 4;
    const incTotal = Object.values(incomeMap).reduce((s, v) => s + v, 0);
    const expTotal = Object.values(expenseMap).reduce((s, v) => s + v, 0);

    let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" xmlns="http://www.w3.org/2000/svg">`;
    cats.forEach((cat, i) => {
      const inc = incomeMap[cat] || 0;
      const exp = expenseMap[cat] || 0;
      const cx = padL + slot * i + slot / 2;
      const hIn = max ? (inc / max) * chartH : 0;
      const hEx = max ? (exp / max) * chartH : 0;
      const xIn = cx - barW - gap / 2;
      const xEx = cx + gap / 2;
      const incPct = incTotal ? (inc / incTotal * 100) : 0;
      const expPct = expTotal ? (exp / expTotal * 100) : 0;
      if (inc > 0) {
        const yIn = padT + (chartH - hIn);
        svg += `<rect x="${xIn.toFixed(1)}" y="${yIn.toFixed(1)}" width="${barW}" height="${hIn.toFixed(1)}" rx="3" fill="#C03A3A"/>`;
        svg += `<text x="${(xIn + barW / 2).toFixed(1)}" y="${(yIn - 5).toFixed(1)}" font-size="9" text-anchor="middle" fill="#C03A3A">${inc.toFixed(0)} · ${incPct.toFixed(0)}%</text>`;
      }
      if (exp > 0) {
        const yEx = padT + (chartH - hEx);
        svg += `<rect x="${xEx.toFixed(1)}" y="${yEx.toFixed(1)}" width="${barW}" height="${hEx.toFixed(1)}" rx="3" fill="#147D5A"/>`;
        svg += `<text x="${(xEx + barW / 2).toFixed(1)}" y="${(yEx - 5).toFixed(1)}" font-size="9" text-anchor="middle" fill="#147D5A">${exp.toFixed(0)} · ${expPct.toFixed(0)}%</text>`;
      }
      svg += `<text x="${cx.toFixed(1)}" y="${H - padB + 16}" font-size="10" text-anchor="middle" fill="#6B7280">${esc(cat)}</text>`;
    });
    svg += `</svg>`;

    const legend = `<div class="chart-legend" style="margin-bottom:8px;">
      <div class="chart-legend-item"><span class="dot" style="background:#C03A3A"></span>收入</div>
      <div class="chart-legend-item"><span class="dot" style="background:#147D5A"></span>支出</div>
    </div>`;

    box.innerHTML = legend + svg;
  }

  // ============ 综合图：扇形（单饼：收入红色系、支出绿色系，混在一起 + 图例） ============
  function renderCombinedPieChart(box, cats, incomeMap, expenseMap) {
    const entries = [];
    let incIdx = 0, expIdx = 0;
    Object.keys(incomeMap).forEach(cat => {
      const amt = incomeMap[cat];
      if (amt > 0) entries.push({ cat, amt, kind: "income", color: INCOME_COLORS[incIdx++ % INCOME_COLORS.length] });
    });
    Object.keys(expenseMap).forEach(cat => {
      const amt = expenseMap[cat];
      if (amt > 0) entries.push({ cat, amt, kind: "expense", color: EXPENSE_COLORS[expIdx++ % EXPENSE_COLORS.length] });
    });

    const total = entries.reduce((s, e) => s + e.amt, 0);
    const cx = 100, cy = 100, r = 88;
    let angle = -Math.PI / 2;
    let slices = "";
    entries.forEach(e => {
      const frac = total ? e.amt / total : 0;
      const end = angle + frac * Math.PI * 2;
      const x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
      const x2 = cx + r * Math.cos(end), y2 = cy + r * Math.sin(end);
      const large = frac > 0.5 ? 1 : 0;
      slices += `<path d="M${cx} ${cy} L${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${e.color}"/>`;
      angle = end;
    });

    const legend = entries.map(e => {
      const pct = total ? (e.amt / total * 100) : 0;
      return `<div class="chart-legend-item"><span class="dot" style="background:${e.color}"></span>${e.kind === "income" ? "收入·" : "支出·"}${esc(e.cat)} ¥${e.amt.toFixed(2)} · ${pct.toFixed(1)}%</div>`;
    }).join("");

    box.innerHTML = `
      <div style="display:flex; align-items:center; gap:20px; flex-wrap:wrap;">
        <svg viewBox="0 0 200 200" width="160" height="160" xmlns="http://www.w3.org/2000/svg">${slices}</svg>
        <div class="chart-legend">${legend}</div>
      </div>`;
  }

  function renderBarChart(box, entries) {
    const W = 600, H = 260, padT = 24, padB = 34, padL = 8, padR = 8;
    const chartW = W - padL - padR;
    const chartH = H - padT - padB;
    const max = entries[0][1];
    const total = entries.reduce((s, e) => s + e[1], 0);
    const n = entries.length;
    const slot = chartW / n;
    const barW = Math.min(48, slot * 0.6);

    let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" xmlns="http://www.w3.org/2000/svg">`;
    entries.forEach(([cat, amt], i) => {
      const h = max ? (amt / max) * chartH : 0;
      const x = padL + slot * i + (slot - barW) / 2;
      const y = padT + (chartH - h);
      const color = CHART_COLORS[i % CHART_COLORS.length];
      const pct = total ? (amt / total * 100) : 0;
      svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW}" height="${h.toFixed(1)}" rx="4" fill="${color}"/>`;
      svg += `<text x="${(x + barW / 2).toFixed(1)}" y="${H - padB + 16}" font-size="11" text-anchor="middle" fill="#6B7280">${esc(cat)}</text>`;
      svg += `<text x="${(x + barW / 2).toFixed(1)}" y="${(y - 6).toFixed(1)}" font-size="10" text-anchor="middle" fill="#1E2227">${amt.toFixed(0)} · ${pct.toFixed(0)}%</text>`;
    });
    svg += `</svg>`;
    box.innerHTML = svg;
  }

  function renderPieChart(box, entries, total) {
    const cx = 100, cy = 100, r = 88;
    let angle = -Math.PI / 2;
    let slices = "";
    entries.forEach(([cat, amt], i) => {
      const frac = total ? amt / total : 0;
      const end = angle + frac * Math.PI * 2;
      const x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
      const x2 = cx + r * Math.cos(end), y2 = cy + r * Math.sin(end);
      const large = frac > 0.5 ? 1 : 0;
      slices += `<path d="M${cx} ${cy} L${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${CHART_COLORS[i % CHART_COLORS.length]}"/>`;
      angle = end;
    });
    const legend = entries.map(([cat, amt], i) => {
      const pct = total ? (amt / total * 100) : 0;
      return `<div class="chart-legend-item"><span class="dot" style="background:${CHART_COLORS[i % CHART_COLORS.length]}"></span>${esc(cat)} ¥${amt.toFixed(2)} · ${pct.toFixed(1)}%</div>`;
    }).join("");

    box.innerHTML = `
      <div style="display:flex; align-items:center; gap:20px; flex-wrap:wrap;">
        <svg viewBox="0 0 200 200" width="160" height="160" xmlns="http://www.w3.org/2000/svg">${slices}</svg>
        <div class="chart-legend">${legend}</div>
      </div>`;
  }

  function handleSave() {
    const amount = parseFloat(document.getElementById("amount").value);
    const note = document.getElementById("note").value.trim();
    const date = document.getElementById("date").value;
    const account = Number(document.getElementById("accountSel").value) || null;
    const toAccount = Number(document.getElementById("toAccountSel").value) || null;
    const depositDir = (selectedType === "押金") ? selectedDepositDir : null;
    const depositTarget = document.getElementById("depositTarget").value.trim();

    // 逐个检查，缺什么就提示什么
    if (!selectedType) { showMsg("请先选择一个类型"); return; }
    if (!selectedCategory) { showMsg("请先选择一个类别"); return; }
    if (isNaN(amount) || amount <= 0) { showMsg("请输入大于 0 的金额"); return; }
    if (!date) { showMsg("请选择日期"); return; }
    if (needsAccount(selectedType) && !account) { showMsg("请选择账户"); return; }
    if (selectedType === "转账") {
      if (!toAccount) { showMsg("转账需要选择转入账户"); return; }
      if (account === toAccount) { showMsg("转出和转入账户不能相同"); return; }
    }
    if (selectedType === "押金") {
      if (!depositDir) { showMsg("请选择押金方向（主动收/别人退回/主动付/我退）"); return; }
      if (!depositTarget) { showMsg("请填写押金对象（谁对谁押）"); return; }
    }

    const wasEdit = !!editingId;
    if (wasEdit) {
      // 编辑模式：更新那笔账
      const rec = records.find(r => r.id === editingId);
      rec.type = selectedType;
      rec.amount = amount;
      rec.category = selectedCategory;
      rec.note = note;
      rec.date = date;
      rec.account = account;
      rec.toAccount = (selectedType === "转账") ? toAccount : null;
      rec.depositDir = depositDir;
      rec.depositTarget = (selectedType === "押金") ? depositTarget : null;
    } else {
      // 新增模式
      records.push({
        id: Date.now(),        // 用当前时间戳当唯一 id
        type: selectedType,
        amount: amount,
        category: selectedCategory,
        note: note,
        date: date,
        account: account,
        toAccount: (selectedType === "转账") ? toAccount : null,
        depositDir: depositDir,
        depositTarget: (selectedType === "押金") ? depositTarget : null
      });
    }

    save();
    resetForm();
    // 先重置再提示，否则 resetForm 会把提示清掉
    showMsg(wasEdit ? "已保存修改" : "已记一笔");
    render();
  }

  // 导出：把所有 jizhangben_ 开头的本地数据打包成一个 JSON 文件下载
  function exportBackup() {
    const data = {};
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.indexOf("jizhangben_") === 0) {
        data[key] = localStorage.getItem(key);
      }
    }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "记账本备份_" + todayStr() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showBackupMsg("已导出备份文件");
  }

  // 导入：把备份文件写回 localStorage，覆盖现有数据（覆盖前确认）
  function importBackup(file) {
    if (!file) return;
    if (!confirm("导入会覆盖当前所有账本和账目，确定继续吗？")) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || typeof data !== "object" || Array.isArray(data)) throw new Error("bad");
        const keys = Object.keys(data);
        if (keys.length === 0 || !keys.some(k => k.indexOf("jizhangben_") === 0)) throw new Error("bad");
        // 先清掉现有的 jizhangben_ 数据，再写入备份，避免残留旧账本
        const existing = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.indexOf("jizhangben_") === 0) existing.push(k);
        }
        existing.forEach(k => localStorage.removeItem(k));
        keys.forEach(k => {
          if (k.indexOf("jizhangben_") === 0) localStorage.setItem(k, data[k]);
        });
        reloadData();
        showBackupMsg("已恢复备份");
      } catch (e) {
        showBackupMsg("备份文件无效，请重新选择", true);
      }
    };
    reader.onerror = () => { showBackupMsg("读取文件失败，请重试", true); };
    reader.readAsText(file);
  }

    switchBook(Number(document.getElementById("bookSel").value));
  };
  document.getElementById("bookManageBtn").onclick = () => toggleBookPanel(true);
  document.getElementById("bookBackBtn").onclick = () => toggleBookPanel(false);
  document.getElementById("bookSaveBtn").onclick = handleBookSave;
  document.getElementById("bookCancelBtn").onclick = resetBookForm;
  document.getElementById("exportBtn").onclick = exportBackup;
  document.getElementById("importBtn").onclick = () => {
    document.getElementById("importFile").click();
  };
  document.getElementById("importFile").onchange = (e) => {
    const f = e.target.files[0];
    if (f) importBackup(f);
    e.target.value = "";  // 清掉，方便下次再选同一个文件
  };

  loadBooks();   // 先读账本清单，定好当前是哪个账本
  load();        // 再读这个账本的账目
  loadAccounts();
  loadCustomTypes();
  loadCustomCategories();
  renderBookSelect();
  renderBookList();
  renderTypeChips();
  renderCategoryChips();
  renderAccountSelects();
  fillCategoryFilter();
  updateFormFields();
  render();
</script>
</body>
</html>
