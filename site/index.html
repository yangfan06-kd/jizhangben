<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>简簿 · 安装</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/app-icon.png">
<style>
:root {
  color-scheme: light;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  color: #172e28;
  background: #f5f4ed;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100svh;
  background:
    radial-gradient(ellipse at 6% 1%, #e1efe6 0%, transparent 53%),
    radial-gradient(ellipse at 100% 70%, #f1e6d5 0%, transparent 52%),
    #f6f5ef;
}
main {
  width: min(620px, 100% - 40px);
  margin: auto;
  padding: clamp(48px, 12vh, 108px) 0 28px;
}
header { text-align: center; margin-bottom: 30px; }
header img {
  width: 64px;
  height: 64px;
  border-radius: 16px;
  box-shadow: 0 8px 22px #163e2d22;
}
h1 { font-size: clamp(2.15rem, 7vw, 3rem); line-height: 1.15; letter-spacing: .02em; margin: 14px 0 9px; }
p { margin: 0; line-height: 1.6; }
header p { color: #485d54; font-size: .9375rem; }
.install-panel {
  padding: 0 26px;
  border-radius: 26px;
  border: 1px solid #ffffffda;
  background: #fbfcf8;
  box-shadow: inset 0 1px 0 #fff, 0 16px 42px #273e2920, 0 1px 3px #273e2910;
}
@supports (backdrop-filter: blur(16px)) or (-webkit-backdrop-filter: blur(16px)) {
  .install-panel {
    background: #fcfdf9b8;
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
  }
}
@media (prefers-reduced-transparency: reduce) {
  .install-panel { background: #fbfcf8; -webkit-backdrop-filter: none; backdrop-filter: none; }
}
.platform {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 15px 22px;
  align-items: center;
  padding: 26px 0;
}
.platform + .platform { border-top: 1px solid #29453322; }
h2 { font-size: 1.25rem; line-height: 1.3; margin: 0 0 5px; letter-spacing: -.015em; }
.meta { color: #4f6259; font-size: .8125rem; }
.install-action {
  min-height: 46px;
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 16px;
  border-radius: 999px;
  padding: 10px 19px;
  background: #225740;
  color: #fff;
  font-size: .875rem;
  font-weight: 650;
  text-decoration: none;
}
.install-action:hover { background: #184330; }
.install-action:focus-visible { outline: 2px solid #245a45; outline-offset: 3px; }
.install-action span { font-size: 1.1rem; line-height: 1; }
.tip {
  margin: 16px 4px 0;
  text-align: center;
  color: #4f6259;
  font-size: .8125rem;
}
@media (max-width: 490px) {
  main { width: min(620px, 100% - 36px); }
  header { margin-bottom: 24px; }
  .install-panel { padding: 0 19px; }
  .platform { grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 19px 0; }
  .install-action { width: 100%; }
}
</style>
<style>
.f-mark {
  display: inline-grid;
  place-items: center;
  width: 64px;
  height: 64px;
  border-radius: 16px;
  background: #0a0a0a;
  color: #fff;
  font: 800 41px/1 "Arial", sans-serif;
  box-shadow: 0 8px 22px #172e2826;
}
</style></head>
<body>
<main>
  <header>
    <span class="f-mark" aria-hidden="true">F</span>
    <h1>简簿</h1>
    <p>无需注册，支持离线记账</p>
  </header>
  <section class="install-panel" aria-label="安装简簿">
    <article class="platform">
      <div>
        <h2>Android</h2>
        <p class="meta"><span>v2.18</span> · <span>3.3 MB</span> · Android 7.0 及以上</p>
        <p class="meta">下载后打开 APK。更新时直接覆盖安装。</p>
      </div>
      <a class="install-action" href="download/jizhangben-v2.18.apk" download="简簿-v2.18.apk">下载安卓版 <span aria-hidden="true">↓</span></a>
    </article>
    <article class="platform">
      <div>
        <h2>iPhone</h2>
        <p class="meta">在 Safari 打开，选择「分享 → 添加到主屏幕」。</p>
      </div>
      <a class="install-action" href="https://jizhangben-iphone-test-2026.pages.dev/">打开 iPhone 版 <span aria-hidden="true">›</span></a>
    </article>
  </section>
  <p class="tip">换手机或重装前，请在应用内导出备份。</p>
</main>
</body>
</html>
